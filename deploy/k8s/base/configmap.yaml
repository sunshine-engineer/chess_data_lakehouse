apiVersion: v1
kind: ConfigMap
metadata:
  name: chess-config
data:
  # Patch this endpoint and the storage class in your own overlay.
  PGHOST: replace-with-postgres-host
  PGPORT: '5432'
  PGDATABASE: chess
  PGADMIN_USER: chess
  PGSSLMODE: verify-full
  PGSSLROOTCERT: /database-tls/ca.crt
  CHESS_DATA_ROOT: /data
  CHESS_REPORTS_ROOT: /reports
  STUDY_ROOT: /study
  ML_ROOT: /models
  EVIDENCE_ROOT: /reports
  CHESS_BIND_HOST: 0.0.0.0
  CHESS_WEB_PORT: '8080'
  CHESS_STUDY_PORT: '8081'
  CHESS_WORKER_PORT: '8082'
  CHESS_WEB_THREADS: '4'
  CHESS_STUDY_THREADS: '4'
  STUDY_SERVICE_URL: http://study-api:8081
  STUDY_PROXY_TIMEOUT_SECONDS: '300'
  STUDY_MAX_UPLOAD_BYTES: '1099511627776'
  STUDY_WORKER: '0'
  STUDY_WORKER_POLL_SECONDS: '1'
  STUDY_SHUTDOWN_SECONDS: '330'
  STUDY_REPERTOIRE_GAME_SECONDS: '30'
  STUDY_MAX_LIBRARY_GAMES: '0'
  STUDY_MAX_STORAGE_BYTES: '0'
  STUDY_BATCH_GAMES: '100'
  STUDY_MIN_FREE_DISK_BYTES: '268435456'
  STUDY_SECURE_COOKIES: '1'
  CHESS_ARCHIVE_POLL_SECONDS: '3'
  CHESS_ARCHIVE_CHECK_SECONDS: '3600'
  SPARK_MASTER: local[2]
  SPARK_LOCAL_IP: 127.0.0.1
