apiVersion: apps/v1
kind: Deployment
metadata:
  name: study-worker
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: chess-study-worker}
  template:
    metadata:
      labels: {app: chess-study-worker, component: study-worker}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 360
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: study-worker
          image: chess-lakehouse-web:local
          imagePullPolicy: IfNotPresent
          command: [python, -m, chess_lakehouse.personal.workspace.worker]
          envFrom: [{configMapRef: {name: chess-config}}]
          env:
            - {name: PGUSER, value: chess_study}
            - {name: PGPASSWORD_FILE, value: /credentials/study-password}
            - {name: TMPDIR, value: /study/workspace/tmp}
          ports: [{name: worker, containerPort: 8082}]
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: '2', memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe: {httpGet: {path: /livez, port: worker}, failureThreshold: 40, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /livez, port: worker}, periodSeconds: 15}
          readinessProbe: {httpGet: {path: /readyz, port: worker}, periodSeconds: 10, timeoutSeconds: 6}
          volumeMounts:
            - {name: credentials, mountPath: /credentials, readOnly: true}
            - {name: database-tls, mountPath: /database-tls, readOnly: true}
            - {name: study, mountPath: /study}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: credentials
          secret: {secretName: chess-credentials, defaultMode: 0440, items: [{key: study-password, path: study-password}]}
        - name: database-tls
          secret: {secretName: chess-db-tls, optional: true, defaultMode: 0440}
        - {name: study, persistentVolumeClaim: {claimName: study-data}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
