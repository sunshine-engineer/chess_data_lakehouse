apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base, postgres.yaml]
# Single-node kind/minikube only. RWO claims cannot serve pods on several nodes.
patches:
  - target: {kind: PersistentVolumeClaim}
    patch: |-
      - op: replace
        path: /spec/accessModes
        value: [ReadWriteOnce]
  - target: {kind: ConfigMap, name: chess-config}
    patch: |-
      - op: replace
        path: /data/PGHOST
        value: postgres
      - op: replace
        path: /data/PGSSLMODE
        value: disable
      - op: replace
        path: /data/STUDY_SECURE_COOKIES
        value: '0'
