apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector: {app: chess-postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: chess-postgres}
  template:
    metadata:
      labels: {app: chess-postgres, component: postgres}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: postgres:16
          env:
            - {name: POSTGRES_DB, valueFrom: {configMapKeyRef: {name: chess-config, key: PGDATABASE}}}
            - {name: POSTGRES_USER, valueFrom: {configMapKeyRef: {name: chess-config, key: PGADMIN_USER}}}
            - {name: POSTGRES_PASSWORD_FILE, value: /credentials/admin-password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgres, containerPort: 5432}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: '2', memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe: {tcpSocket: {port: postgres}, periodSeconds: 3, failureThreshold: 60}
          readinessProbe: {tcpSocket: {port: postgres}, periodSeconds: 5}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: credentials, mountPath: /credentials, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: credentials
          secret: {secretName: chess-credentials, defaultMode: 0440, items: [{key: admin-password, path: admin-password}]}
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 50Gi}
