apiVersion: batch/v1
kind: Job
metadata:
  name: chess-model-training
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: train
          image: chess-lakehouse-web:local
          command: [python, -m, chess_lakehouse.ml.train]
          envFrom: [{configMapRef: {name: chess-config}}]
          env:
            - {name: PGUSER, value: chess_reader}
            - {name: PGPASSWORD_FILE, value: /credentials/reader-password}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: '2', memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: reports, mountPath: /reports}
            - {name: credentials, mountPath: /credentials, readOnly: true}
            - {name: database-tls, mountPath: /database-tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: models, persistentVolumeClaim: {claimName: model-data}}
        - {name: reports, persistentVolumeClaim: {claimName: report-data}}
        - name: credentials
          secret: {secretName: chess-credentials, defaultMode: 0440, items: [{key: reader-password, path: reader-password}]}
        - name: database-tls
          secret: {secretName: chess-db-tls, optional: true, defaultMode: 0440}
        - {name: tmp, emptyDir: {sizeLimit: 512Mi}}
